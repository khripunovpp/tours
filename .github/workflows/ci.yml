name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Placeholder until the vitest suite lands at the end of M0.
      - name: Test
        run: pnpm test

      - name: Build demo
        run: pnpm build

      # packages/*/dist is committed, because git install ships the tree as-is.
      # A stale dist would silently hand consumers old code, so rebuild and fail
      # if the result differs from what is checked in. The build is byte-
      # reproducible, so any diff is a genuinely missing rebuild.
      - name: Build installable packages
        run: pnpm build:packages

      - name: Verify committed package builds are up to date
        run: |
          if ! git diff --quiet -- packages/*/dist; then
            echo "::error::packages/*/dist is stale — run 'pnpm build:packages' and commit the result"
            git diff --stat -- packages/*/dist
            exit 1
          fi
