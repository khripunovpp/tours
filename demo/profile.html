<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile — @tours demo</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --surface: #ffffff;
        --border: #e2e6ef;
        --text: #1f2733;
        --muted: #6b7688;
        --brand: AccentColor;
        --brand-dark: AccentColor;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .site-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px 32px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 1;
      }
      .site-header .logo { font-weight: 700; font-size: 18px; color: var(--brand); text-decoration: none; }
      .site-nav { display: flex; gap: 24px; }
      .site-nav a { color: var(--muted); text-decoration: none; font-weight: 500; }
      .site-nav a:hover { color: var(--text); }
      main {
        max-width: 760px;
        margin: 32px auto;
        padding: 0 24px;
        display: flex;
        flex-direction: column;
        gap: 28px;
      }
      h1 { margin: 0; font-size: 26px; }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
      }
      .card h2 { margin: 0 0 16px; font-size: 18px; }
      .form-field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
      .form-field label { font-size: 13px; font-weight: 600; color: var(--muted); }
      .form-field input, .form-field textarea {
        font: inherit;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: #fbfcfe;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: none;
        border-radius: 8px;
        padding: 10px 18px;
        font-weight: 600;
      }
      .btn-primary { background: var(--brand); color: #fff; }
      .demo-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        z-index: 10;
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 14px;
        background: #111827;
        color: #fff;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      }
      .demo-panel .demo-title {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #9aa4b8;
      }
      .demo-panel button { background: #1f2a3d; color: #fff; text-align: left; }
      .demo-panel button:hover { background: #2b3a55; }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="logo" href="index.html">Community</a>
      <nav class="site-nav">
        <a href="index.html">Feed</a>
        <a href="profile.html">Profile</a>
        <a href="triggers.html">Triggers</a>
        <a href="spa.html">SPA</a>
      </nav>
    </header>

    <main>
      <h1>Your profile</h1>

      <section class="card">
        <h2>Edit details</h2>
        <form id="profile-form">
          <div class="form-field">
            <label for="profile-name">Display name</label>
            <input id="profile-name" name="displayName" type="text" placeholder="How should we call you?" />
          </div>
          <div class="form-field">
            <label for="profile-bio">Bio</label>
            <textarea id="profile-bio" name="bio" rows="3" placeholder="A few words about you"></textarea>
          </div>
          <button id="profile-save" class="btn-primary" type="submit">Save profile</button>
        </form>
      </section>

      <section id="profile-avatar" class="card">
        <h2>Avatar</h2>
        <button id="btn-upload" class="btn-primary" type="button">Upload a photo</button>
      </section>
    </main>

    <aside class="demo-panel">
      <span class="demo-title">@tours demo · Profile</span>
      <button id="open-builder">🛠 Open builder</button>
      <button id="run-tour">▶ Run tour</button>
      <button id="pick-element">🎯 Pick element</button>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
