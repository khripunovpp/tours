<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SPA (React) — @tours demo</title>
    <style>
      :root { --bg:#f4f6fb; --surface:#fff; --border:#e2e6ef; --text:#1f2733; --muted:#6b7688; --brand:AccentColor; }
      * { box-sizing: border-box; }
      body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
      .site-header { display:flex; align-items:center; justify-content:space-between; padding:16px 32px; background:var(--surface); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:1; }
      .logo { font-weight:700; font-size:18px; color:var(--brand); text-decoration:none; }
      .site-nav { display:flex; gap:24px; }
      .site-nav a { color:var(--muted); text-decoration:none; font-weight:500; }
      .site-nav a.active { color:var(--text); }
      .site-nav a:hover { color:var(--text); }
      main { max-width:760px; margin:32px auto; padding:0 24px; }
      h1 { margin:0 0 8px; font-size:26px; }
      .card { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; margin-top:20px; }
      .form-field { display:flex; flex-direction:column; gap:6px; margin-bottom:16px; }
      .form-field label { font-size:13px; font-weight:600; color:var(--muted); }
      .form-field input { font:inherit; padding:10px 12px; border:1px solid var(--border); border-radius:8px; background:#fbfcfe; }
      button { font:inherit; cursor:pointer; border:none; border-radius:8px; padding:10px 18px; font-weight:600; }
      .btn-primary { background:var(--brand); color:#fff; }
      .demo-panel { position:fixed; top:16px; right:16px; z-index:10; display:flex; flex-direction:column; gap:8px; padding:14px; background:#111827; color:#fff; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,0.25); }
      .demo-panel .demo-title { font-size:12px; text-transform:uppercase; letter-spacing:0.06em; color:#9aa4b8; }
      .demo-panel button { background:#1f2a3d; color:#fff; text-align:left; }
      .demo-panel button:hover { background:#2b3a55; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <aside class="demo-panel">
      <span class="demo-title">@tours demo · SPA (React)</span>
      <button id="open-builder">🛠 Open builder</button>
      <button id="pick-element">🎯 Pick element</button>
    </aside>

    <script type="module" src="/src/spa-react.tsx"></script>
  </body>
</html>
